episode: ep01
story: "《七星鲁王》ep01《血尸》"
facts_version: 1
primary_renderer: seedance
beats:
  beat_01:
    title: 血土钩子
    source_span:
      - "原文开头至“就像刚刚在血液里蘸过一样”"
      - "director_analysis 剧情点1"
    scene: 镖子岭荒野土丘
    scene_function: 钩子 / 异常物先行
    characters_on_screen: []
    key_props:
      - 洛阳铲铲头
    continuity_in:
      - "首拍，无前置人物连续性。"
      - "全片室外月光统一来自右上方四十度，阴影投向左下。"
    story_facts:
      - "先看见洛阳铲铲头和它带出的深层黄土，不先给人物。"
      - "铲口正在向外渗出深红褐色液体，这是全剧第一个异常证据。"
    blocking_facts:
      center_anchor: "土丘顶面作业区里的洛阳铲铲头与渗土"
      positions:
        frame: "无人入画，铲头位于画面中央偏下，背景只保留少量冷月黄土。"
      keep_relations:
        - "不提前露出四人围拢关系。"
      screen_blocking_facts:
        - "铲头是唯一主体，红褐渗出必须落在冷色画面里成为唯一暖色信息点。"
    axis_lock:
      inherits_from: beat_00
      rule: "新建异常物观察轴，无人物越轴问题。"
    object_continuity:
      洛阳铲铲头:
        holder: 地面
        attach_to: "土丘顶面中央作业区"
        screen_zone: "center_low"
        note: "黄土和深红褐液体都附着在同一铲头上。"
    ownership_transfers: []
    state_transition: []
    dialogue_address: 无台词
    eyeline_rule: 无人物视线
    camera_side_rule: "镜头只站在异常物外侧观察，不先切人物解释。"
    shot_design:
      coverage_pattern: SINGLE_INSERT
      guardrail_profile: ""
      coverage_reason: "这一拍的信息锚点只在铲头异常。"
      shot_function_chain:
        - "异常物建立"
        - "观众被视觉异物钩住"
      default_shot_count: 1
      recommended_control: "全能模式，单镜头 insert"
      model_hint: Seedance 2.0
      narrative_effective_duration: "3-4s"
      generation_duration: "5s"
      risk_level: low
    shot_contract:
      required_nodes:
        - "必须清楚看见洛阳铲铲头上的黄土正在往外渗深红褐液体。"
        - "不能先给人物脸或台词。"
      forbidden:
        - "把异常液体改成普通泥水。"
        - "把洞口或人物提前塞进同一镜头。"
      landing:
        - "画面最终仍停在铲头异常上，让观众先记住不对劲的土。"

  beat_02:
    title: 老烟头定性
    source_span:
      - "原文四人围铲至老烟头说出“下面是个血尸嘎”"
      - "director_analysis 剧情点2"
    scene: 镖子岭荒野土丘
    scene_function: 权威判断 / 群像关系建立
    characters_on_screen:
      - 老烟头
      - 大胡子
      - 老二
      - 老三
    key_props:
      - 洛阳铲铲头
      - 旱烟枪
    continuity_in:
      - "承接 beat_01 的同一土丘顶面和同一异常铲头。"
      - "异常物仍在众人中央，所有人是被它围拢起来的。"
    story_facts:
      - "四个人蹲成松散半弧围住铲头。"
      - "老烟头坐在中央偏右略高位，敲旱烟枪后说出“血尸”判断。"
      - "其余三人不是整齐同步震惊，而是先盯土，再被那两个字逐个击中。"
    blocking_facts:
      center_anchor: "地上洛阳铲铲头"
      positions:
        老烟头: "画面中央偏右略高位，侧脸对镜头，离铲头最近的一侧。"
        老二: "画面左前方较低位，最先顶着劲，离老烟头最近。"
        大胡子: "画面左后方较低位，在老二侧后。"
        老三: "画面右后外侧低位，身形最小，仍缩在边缘。"
      keep_relations:
        - "四人围成弧形，铲头处在弧形开口中心。"
        - "老烟头的高位和其余三人的低位差必须成立。"
      screen_blocking_facts:
        - "镜头视角固定在同一侧，老烟头始终压住右侧高位，其余三人压在左侧和后侧。"
    axis_lock:
      inherits_from: beat_01
      rule: "从异常物轴扩展成群像轴，但仍站在铲头外侧同一面，不翻转左右。"
    object_continuity:
      洛阳铲铲头:
        holder: 地面
        attach_to: "四人弧形中央"
        screen_zone: "center_low"
      旱烟枪:
        holder: 老烟头
        attach_to: "右手/身前"
        screen_zone: "right_mid"
    ownership_transfers: []
    state_transition: []
    dialogue_address: "老烟头这句判断是说给全体听，也是在给整场戏定性。"
    eyeline_rule: "老烟头先看铲头再抬眼扫过众人；其余三人视线先落铲头，再被“血尸”二字拉到老烟头脸上。"
    camera_side_rule: "先给群像关系，再收老烟头偏侧中近景；禁止正对镜头播报。"
    shot_design:
      coverage_pattern: MASTER_COVERAGE
      guardrail_profile: GROUP_PRESSURE_DIALOGUE
      coverage_reason: "这拍既要建群像关系，又要让权威判断落地。"
      shot_function_chain:
        - "群像弧形建立"
        - "老烟头敲烟枪并定性"
        - "异步反应落到另外三人"
      default_shot_count: 3
      recommended_control: "全能模式 multi-shot"
      model_hint: Seedance 2.0
      narrative_effective_duration: "6-7s"
      generation_duration: "8s"
      risk_level: medium
    shot_contract:
      required_nodes:
        - "必须先看清四人围铲的半弧关系。"
        - "老烟头必须处在中央偏右略高位并握着旱烟枪。"
        - "“血尸”说出后，另外三人的反应要异步，不可整齐摆拍。"
      forbidden:
        - "把四个人重排成一字排或对镜说话。"
        - "丢掉铲头这个中心锚点。"
      landing:
        - "最后落在其余三人被判断压住的空气上。"

  beat_03:
    title: 老二硬顶
    source_span:
      - "原文老二抢话、大胡子接骂、老烟头压回去"
      - "director_analysis 剧情点3"
    scene: 镖子岭荒野土丘
    scene_function: 家族权力碰撞 / 莽劲暴露
    characters_on_screen:
      - 老烟头
      - 大胡子
      - 老二
      - 老三
    key_props:
      - 洛阳铲铲头
      - 旱烟枪
      - 匣子炮
    continuity_in:
      - "沿用 beat_02 的半弧站位和同一轴线。"
      - "铲头仍是所有人围拢的中心。"
    story_facts:
      - "老二在左前方半站起顶撞老烟头，提出自己和弟弟下洞，还炫耀匣子炮。"
      - "老烟头不动怒，只借话头把老二和大胡子一起压回去。"
      - "大胡子紧接着从老二侧后开骂，形成父子同轴但权力上仍受老烟头压制。"
    blocking_facts:
      center_anchor: "仍是地上铲头，但冲突线移到老烟头与老二之间"
      positions:
        老烟头: "中央偏右高位，基本不换位，只用眼神和旱烟枪压场。"
        老二: "左前方半站起前压，身子探向老烟头。"
        大胡子: "左后方贴着老二侧后，随时接骂。"
        老三: "右后外围低位，看热闹又怕事，不进入主冲突线。"
      keep_relations:
        - "左右顺序不变，只把镜头收近。"
        - "老二在前，大胡子在后，形成父子一前一后。"
      screen_blocking_facts:
        - "镜头不越轴，始终让老烟头压在右侧，老二从左前顶上来。"
    axis_lock:
      inherits_from: beat_02
      rule: "严格保持上一拍轴线和左右顺序，只从 master 收到冲突核心。"
    object_continuity:
      洛阳铲铲头:
        holder: 地面
        attach_to: "群像中心"
        screen_zone: "low_center"
      旱烟枪:
        holder: 老烟头
        attach_to: "手里"
        screen_zone: "right_mid"
      匣子炮:
        holder: 老二
        attach_to: "右腰或手边"
        screen_zone: "left_front"
        note: "这把枪属于老二，直到 beat_08 才转给老三。"
    ownership_transfers: []
    state_transition: []
    dialogue_address: "老二顶给老烟头；老烟头既压老二也敲打大胡子；大胡子再回头压儿子。"
    eyeline_rule: "老二盯老烟头；大胡子盯老二；老烟头多看老二，偶尔扫向大胡子；老三在外围来回看铲头和说话人。"
    camera_side_rule: "禁止采访机位；先站在老烟头肩线外侧看老二顶上来，再切回右侧高位的老烟头。"
    shot_design:
      coverage_pattern: PRESSURE_DIALOGUE
      guardrail_profile: GROUP_PRESSURE_DIALOGUE
      coverage_reason: "这拍靠群像里的权力指向和异步反应成立。"
      shot_function_chain:
        - "维持群像 master"
        - "老二顶撞起身"
        - "老烟头压回"
        - "大胡子从侧后补骂"
      default_shot_count: 4
      recommended_control: "全能模式 multi-shot"
      model_hint: Seedance 2.0
      narrative_effective_duration: "7-8s"
      generation_duration: "8s"
      risk_level: medium
    shot_contract:
      required_nodes:
        - "老二必须在左前方半站起前压。"
        - "老烟头必须不发火地把冲劲压回去。"
        - "大胡子必须从老二侧后接骂，不得平空插到另一边。"
      forbidden:
        - "翻转老烟头与老二左右关系。"
        - "把老三拉进主冲突中心。"
      landing:
        - "落在年轻人的莽被压回去，但空气更不稳。"

  beat_04:
    title: 分工落定
    source_span:
      - "原文老烟头分派下洞顺序、老三被留下、老三赌气"
      - "director_analysis 剧情点4A"
    scene: 镖子岭荒野土丘转盗洞口
    scene_function: 分工定局 / 入洞前地面落位
    characters_on_screen:
      - 老烟头
      - 大胡子
      - 老二
      - 老三
    key_props:
      - 旱烟枪
      - 土耗子
      - 匣子炮
      - 盗洞口
    continuity_in:
      - "承接 beat_03 的同一群像轴线，但中心锚点从铲头转向盗洞口。"
      - "人物不能随机洗牌，必须从争执站位自然重排到执行站位。"
    story_facts:
      - "老烟头先讲前车之鉴，再当场把顺序和退路定死。"
      - "下洞三人是老烟头在前、大胡子居中跟进、老二殿后并带土耗子，但本拍只建立顺位，不开始下洞。"
      - "老三被明确留在地面守洞口，负责抓土耗子尾巴，里面一吆喝就往外拉。"
      - "老三闹别扭，但老烟头只是哄，不改分工。"
      - "这一拍不能出现任何人真正开始往下下，也不能出现地面只剩老三的结果态。"
    blocking_facts:
      center_anchor: "盗洞口"
      positions:
        老烟头: "先从右侧高位起身走到洞口前缘，成为最靠近洞口的人，但双脚始终留在地表边缘。"
        大胡子: "跟在老烟头左后半步，形成第二顺位，但仍停在地面。"
        老二: "留在更后一点的左侧或后侧，带着土耗子和匣子炮，形成第三顺位，但仍停在地面。"
        老三: "被压到洞口外侧右后位，手里接住土耗子尾端，不能进入下洞队列。"
      keep_relations:
        - "老烟头仍是右侧主导位。"
        - "大胡子和老二都进下洞队列，老三被钉在地面守位。"
      screen_blocking_facts:
        - "洞口成为新中心，三名后续下洞者在地面围成向黑洞收紧的前后纵队。"
        - "老三必须明显与下洞三人分离，站在地面退路位置。"
        - "洞内始终纯黑，不出现任何已开始下洞的身位、手脚或探入动作。"
    axis_lock:
      inherits_from: beat_03
      rule: "允许围绕洞口重排，但仍停留在同一侧观察，不可突然翻转老烟头右侧主导位。"
    object_continuity:
      土耗子:
        holder: "老二主带，尾端交给老三"
        attach_to: "前端仍在准备入洞的三人这一侧，尾端明确在老三手里"
        screen_zone: "从洞口向老三守位延伸"
        note: "这是后续 beat_05 至 beat_10 的同一件关键连续道具。"
      匣子炮:
        holder: 老二
        attach_to: "右腰或手边"
        screen_zone: "rear_left"
      旱烟枪:
        holder: 老烟头
        attach_to: "手里"
        screen_zone: "front_right"
      盗洞口:
        holder: 场景
        attach_to: "土丘顶面中央偏右"
        screen_zone: "center"
    ownership_transfers:
      - object: 土耗子尾端控制权
        from: 老二
        to: 老三
        effective_from: beat_04
    state_transition:
      - subject: 下洞顺位
        start_state: "四人刚从争执群像转入执行阶段，尚未形成明确前中后顺位。"
        transition_action: "老烟头走到洞口前缘，逐个点名自己在前、大胡子居中、老二带土耗子殿后。"
        completion_boundary: "三名后续入洞者只在洞口周边地面完成前后顺位落位；这一拍不出现任何人开始下洞，不出现身体探入黑洞，不出现下洞机制展示。"
        end_state: "入洞顺位被锁定为老烟头 -> 大胡子 -> 老二，但执行动作留到下一拍。"
      - subject: 老三职责
        start_state: "老三还在四人争执关系里，没有被剥离出独立职责。"
        transition_action: "老烟头明确命令老三留在地面，不准下去，只抓土耗子尾端守退路。"
        completion_boundary: "老三站到洞口外侧右后守位，手上接住绳尾并与入洞三人分离。"
        end_state: "老三从争执参与者转为地面守绳者，职责建立但情绪委屈未消。"
    dialogue_address: "老烟头对全体分派，但逐个点名大胡子、老二、老三；老三的抗议冲老烟头和两位兄长。"
    eyeline_rule: "老烟头说分工时依次看洞口、跟进者、老三守位；老三一直盯老烟头和土耗子，不看洞内。"
    attention_contract:
      老烟头:
        psychology: "他要把争执压成执行命令，不是在展示自己。"
        looks_to: "先看洞口确认危险入口，再回头扫大胡子、老二和老三。"
        body_faces: "身体朝洞口，头和烟枪回向众人，形成一边下令一边压队列的姿态。"
        hand_action: "旱烟枪像点名棒一样斜指洞口和下洞队列。"
      大胡子:
        psychology: "他接受父辈/长辈的分派，准备跟进，不能再和老二同步顶嘴。"
        looks_to: "看老烟头的烟枪手势或洞口，不看镜头。"
        body_faces: "身体向洞口前压半步，形成第二顺位。"
        hand_action: "手臂收紧在身侧或准备扶洞沿，不抢第一位。"
      老二:
        psychology: "他被压回执行状态，带土耗子殿后，仍有不服但必须认位。"
        looks_to: "看绳线和洞口，偶尔瞥老烟头确认命令。"
        body_faces: "身体在第三位，朝洞口和绳线方向收紧。"
        hand_action: "一手主带土耗子前端，腰边匣子炮保持可见但不抢戏。"
      老三:
        psychology: "他想跟下去证明自己，却被留下守退路，委屈和职责同时压住他。"
        looks_to: "在老烟头手势和自己手里的绳尾之间切换，不看镜头，不看洞内深处。"
        body_faces: "身体微微想跟向洞口，但脚留在地面守位。"
        hand_action: "双手准备接住或抓紧土耗子尾端。"
    camera_side_rule: "先用同侧全景交代洞口重排，再收近老烟头定分工，最后给老三被钉在守位的反应。"
    shot_design:
      coverage_pattern: MASTER_COVERAGE
      guardrail_profile: GROUP_PRESSURE_DIALOGUE
      coverage_reason: "这拍真正重要的是地面上把队列、职责和退路讲清，而不是展示怎么下洞。"
      shot_function_chain:
        - "洞口重排建立"
        - "老烟头点名定顺序"
        - "老三被留在地面守位"
        - "决定已定，不再回改"
        - "停在入洞前准备完成"
      default_shot_count: 4
      recommended_control: "全能模式 multi-shot"
      model_hint: Seedance 2.0
      narrative_effective_duration: "8-9s"
      generation_duration: "10s"
      risk_level: high
    visual_contract:
      source: "output/ep01/cinematography.md"
      lighting_mood: "家族压力 / 洞口分工落位"
      camera_basis:
        - "同侧全景或中全景先交代洞口重排，禁止正前方采访机位。"
        - "后续收近老烟头定分工，再落老三被钉在守位的反应。"
      lens_depth_basis:
        - "28-35mm 标准广角感，人物嵌入洞口空间，四人站位、洞口和绳线都清楚。"
        - "中到大景深，不能把大胡子、老二或老三虚成无意义背景。"
      exposure_motion_basis:
        - "夜景低调曝光，暗部占多数，但分工和职责关系必须可读。"
        - "静态三脚架感或极轻推进，人物移动打破静止，不用炫技运镜。"
      lighting_must_inherit:
        - "月光从画面右上方约40°斜切，人物右脸和右肩有冷白边缘光，左脸和身体背光面压入大块暗部。"
        - "洞口边沿只有冷灰黄窄亮边，洞内深处完全纯黑。"
        - "背景土丘和灌木整体压暗，只保留右侧冷白轮廓。"
      anime_rendering_must_inherit:
